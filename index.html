<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скриншот → текст для Yomitan</title>
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--bd:#d9d9d3;--ac:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ececE8;--mut:#9a9a94;--card:#1f1f1d;--bd:#3a3a36;--ac:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
header h1{font-size:16px;margin:0}
label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;height:calc(100vh - 58px)}
@media (max-width:800px){main{grid-template-columns:1fr;height:auto}}
.pane{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:auto;min-height:240px;padding:12px}
#drop{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);border-style:dashed}
#drop.over{border-color:var(--ac)}
#drop img{max-width:100%;display:block}
#out{font-size:28px;line-height:1.8;font-family:"Noto Sans JP","Yu Gothic","Hiragino Sans",sans-serif;white-space:pre-wrap;outline:none;user-select:text;-webkit-user-select:text}
#out.vert{writing-mode:vertical-rl;height:100%;white-space:pre}
#status{color:var(--mut);font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <h1>Скриншот → Yomitan</h1>
  <button id="pick">Выбрать файл</button>
  <label><input type="checkbox" id="vert"> Вертикальный текст</label>
  <label><input type="checkbox" id="up" checked> Увеличить ×2 (для мелкого текста)</label>
  <button class="sec" id="redo">Распознать заново</button>
  <input type="file" id="file" accept="image/*" hidden>
</header>
<main>
  <div class="pane" id="drop"><div id="ph">Вставь скриншот через Ctrl+V<br>или перетащи картинку сюда</div></div>
  <div class="pane">
    <div id="status">Ожидание картинки…</div>
    <div id="out" contenteditable="true" spellcheck="false" lang="ja"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const workers={};
let currentImg=null;

async function getWorker(lang){
  if(workers[lang]) return workers[lang];
  $('status').textContent='Загрузка модели '+lang+' (первый раз ~15 МБ)…';
  workers[lang]=await Tesseract.createWorker(lang,1,{
    logger:m=>{ if(m.status==='recognizing text') $('status').textContent='Распознавание… '+Math.round(m.progress*100)+'%'; }
  });
  return workers[lang];
}

function toCanvas(img,scale){
  const c=document.createElement('canvas');
  c.width=img.naturalWidth*scale; c.height=img.naturalHeight*scale;
  const x=c.getContext('2d'); x.imageSmoothingQuality='high';
  x.drawImage(img,0,0,c.width,c.height);
  return c;
}

function clean(t){
  const cjk='[\\u3000-\\u9fff\\uff00-\\uffef]';
  return t.replace(new RegExp('(?<='+cjk+')[ \\t]+(?='+cjk+')','g'),'').replace(/\n{3,}/g,'\n\n').trim();
}

async function run(){
  if(!currentImg) return;
  const vert=$('vert').checked;
  $('out').classList.toggle('vert',vert);
  try{
    const w=await getWorker(vert?'jpn_vert':'jpn');
    const src=toCanvas(currentImg,$('up').checked?2:1);
    const {data}=await w.recognize(src);
    $('out').textContent=clean(data.text);
    $('status').textContent='Готово. Наводи Yomitan на текст ниже (текст можно править).';
  }catch(e){
    $('status').textContent='Ошибка: '+e.message+' (нужен интернет для загрузки модели)';
  }
}

function load(file){
  if(!file||!file.type.startsWith('image/')) return;
  const img=new Image();
  img.onload=()=>{
    currentImg=img;
    const d=$('drop'); d.innerHTML=''; d.appendChild(img); d.style.alignItems='flex-start';
    
    run();
  };
  img.src=URL.createObjectURL(file);
}

document.addEventListener('paste',e=>{
  for(const it of e.clipboardData.items){ if(it.type.startsWith('image/')){ load(it.getAsFile()); e.preventDefault(); break; } }
});
const d=$('drop');
d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
d.addEventListener('dragleave',()=>d.classList.remove('over'));
d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');load(e.dataTransfer.files[0])});
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>load(e.target.files[0]);
$('redo').onclick=run;
$('vert').onchange=run;
</script>
</body>
</html>
