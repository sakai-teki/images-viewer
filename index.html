<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скриншот → текст</title>
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--bd:#d9d9d3;--ac:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ececE8;--mut:#9a9a94;--card:#1f1f1d;--bd:#3a3a36;--ac:#fb923c}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;height:100%}
@media (max-width:800px){main{grid-template-columns:1fr;grid-auto-rows:minmax(240px,auto);height:auto}}
.pane{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:auto;padding:12px}
#drop{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);border-style:dashed;cursor:pointer}
#drop.over{border-color:var(--ac)}
#drop img{max-width:100%;display:block}
#status{color:var(--mut);font-size:13px;margin-bottom:8px}
#status:empty{display:none}
#out{font-size:28px;line-height:1.8;font-family:"Noto Sans JP","Yu Gothic","Hiragino Sans",sans-serif;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
#out.vert{writing-mode:vertical-rl;white-space:pre;min-height:240px}
</style>
</head>
<body>
<main>
  <div class="pane" id="drop"><div id="ph">Ctrl+V — вставить скриншот<br>или перетащи картинку<br>или кликни, чтобы выбрать файл</div></div>
  <div class="pane">
    <div id="status"></div>
    <div id="out" lang="ja"></div>
  </div>
</main>
<input type="file" id="file" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const workers={};
let currentImg=null, vertical=false;

async function getWorker(lang){
  if(workers[lang]) return workers[lang];
  $('status').textContent='Загрузка модели… (первый раз ~15 МБ)';
  workers[lang]=await Tesseract.createWorker(lang,1,{
    logger:m=>{ if(m.status==='recognizing text') $('status').textContent='Распознавание… '+Math.round(m.progress*100)+'%'; }
  });
  return workers[lang];
}

function toCanvas(img,scale){
  const c=document.createElement('canvas');
  c.width=img.naturalWidth*scale; c.height=img.naturalHeight*scale;
  const x=c.getContext('2d'); x.imageSmoothingQuality='high';
  x.drawImage(img,0,0,c.width,c.height);
  return c;
}

function clean(t){
  const cjk='[\\u3000-\\u9fff\\uff00-\\uffef]';
  return t.replace(new RegExp('(?<='+cjk+')[ \\t]+(?='+cjk+')','g'),'').replace(/\n{3,}/g,'\n\n').trim();
}

async function run(){
  if(!currentImg) return;
  $('out').classList.toggle('vert',vertical);
  $('out').textContent='';
  try{
    const w=await getWorker(vertical?'jpn_vert':'jpn');
    const {data}=await w.recognize(toCanvas(currentImg,2));
    $('out').textContent=clean(data.text);
    $('status').textContent='';
  }catch(e){
    $('status').textContent='Ошибка: '+e.message+' (нужен интернет для загрузки модели)';
  }
}

function load(file){
  if(!file||!file.type.startsWith('image/')) return;
  const img=new Image();
  img.onload=()=>{
    currentImg=img;
    const d=$('drop'); d.innerHTML=''; d.appendChild(img); d.style.alignItems='flex-start';
    run();
  };
  img.src=URL.createObjectURL(file);
}

document.addEventListener('paste',e=>{
  for(const it of e.clipboardData.items){ if(it.type.startsWith('image/')){ load(it.getAsFile()); e.preventDefault(); break; } }
});
const d=$('drop');
d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
d.addEventListener('dragleave',()=>d.classList.remove('over'));
d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');load(e.dataTransfer.files[0])});
d.addEventListener('click',()=>$('file').click());
$('file').onchange=e=>{load(e.target.files[0]);e.target.value='';};
/* клавиша V — переключить вертикальный текст и распознать заново */
document.addEventListener('keydown',e=>{
  if((e.key==='v'||e.key==='V'||e.key==='м'||e.key==='М')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    vertical=!vertical; run();
  }
});
</script>
</body>
</html>
